<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="60%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <linearGradient id="favBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C7D2FE" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.2" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle Icon Container matching CleverCut Brand Mark -->
  <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#favBg)" />
  <rect x="2" y="2" width="60" height="60" rx="18" stroke="url(#favBorder)" stroke-width="2" />

  <!-- Subtle Ambient Glow -->
  <circle cx="32" cy="32" r="20" fill="#818CF8" opacity="0.25" filter="url(#subtleGlow)" />

  <!-- Clapperboard Symbol (Identical to CleverCut App & Login Screen) -->
  <g transform="translate(14, 14) scale(1.5)" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M20.2 6 3 11l-.9-2.4c-.4-1.1.2-2.4 1.3-2.8l13.7-5c1.1-.4 2.4.2 2.8 1.3Z" />
    <path d="m6.2 5.3 3.1 3.9" />
    <path d="m12.4 3 3.1 4" />
    <path d="M3 11h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z" />
  </g>
</svg>
