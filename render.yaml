services:
  - type: web
    name: clevertize-video-app
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MAGNIFIC_API_KEY
        sync: false
      - key: MAGNIFIC_FLOW_ID
        value: UJAMwnyikX
